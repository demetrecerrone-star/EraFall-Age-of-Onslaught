name: EraFall signed Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - name: Checkout EraFall
        uses: actions/checkout@v4

      - name: Run source consistency checks
        run: python3 tests/check_catalog.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

        with:
          packages: 'platform-tools'

      - name: Install Android export dependencies
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Install matching Godot editor and Android templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fLsS --retry 3 -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -qo /tmp/godot.zip -d /tmp/godotbin
          sudo install -m 755 "/tmp/godotbin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fLsS --retry 3 -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "/tmp/godot-templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -qo /tmp/templates.tpz "templates/android_debug.apk" "templates/android_release.apk" -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/android_*.apk "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "${GODOT_VERSION}.stable" > "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"
          godot --version

      - name: Verify Godot scripts and scene load
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import 2>&1 | tee /tmp/erafall-import.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/erafall-import.log; then exit 1; fi
          godot --headless --path . --quit-after 3 2>&1 | tee /tmp/erafall-run.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/erafall-run.log; then exit 1; fi

      - name: Verify mobile swipe and hold-to-steer gameplay
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/controls_smoke.gd 2>&1 | tee /tmp/erafall-controls.log
          grep -q 'ERAFALL CONTROL SMOKE' /tmp/erafall-controls.log

      - name: Check signing secrets are populated
        env:
          ERAFALL_KEYSTORE_BASE64: ${{ secrets.ERAFALL_KEYSTORE_BASE64 }}
          ERAFALL_STORE_PASSWORD: ${{ secrets.ERAFALL_STORE_PASSWORD }}
          ERAFALL_KEY_ALIAS: ${{ secrets.ERAFALL_KEY_ALIAS }}
          ERAFALL_KEY_PASSWORD: ${{ secrets.ERAFALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ERAFALL_KEYSTORE_BASE64 ERAFALL_STORE_PASSWORD ERAFALL_KEY_ALIAS ERAFALL_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "Required GitHub secret is unset: $name" >&2; exit 1; fi
          done
          echo "All four release-signing secrets are populated."

      - name: Check Godot signing passwords match
        env:
          ERAFALL_STORE_PASSWORD: ${{ secrets.ERAFALL_STORE_PASSWORD }}
          ERAFALL_KEY_PASSWORD: ${{ secrets.ERAFALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$ERAFALL_STORE_PASSWORD" != "$ERAFALL_KEY_PASSWORD" ]]; then
            echo "Store and key passwords differ. Godot built-in Android exporter requires them to match." >&2
            exit 1
          fi
          echo "Store/key password compatibility verified."

      - name: Decode signing keystore
        env:
          ERAFALL_KEYSTORE_BASE64: ${{ secrets.ERAFALL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ERAFALL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/erafall-release.jks"
          test -s "$RUNNER_TEMP/erafall-release.jks"
          chmod 600 "$RUNNER_TEMP/erafall-release.jks"
          echo "Keystore decoded (contents not shown)."

      - name: Check keystore opens with store password
        env:
          ERAFALL_STORE_PASSWORD: ${{ secrets.ERAFALL_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if ! keytool -list -keystore "$RUNNER_TEMP/erafall-release.jks" -storepass "$ERAFALL_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "Keystore could not be opened using ERAFALL_STORE_PASSWORD (wrong password, incompatible or damaged key file)." >&2
            exit 1
          fi
          echo "Keystore password validated independently of the alias."

      - name: Resolve the intended signing key alias
        env:
          ERAFALL_STORE_PASSWORD: ${{ secrets.ERAFALL_STORE_PASSWORD }}
          ERAFALL_KEY_ALIAS: ${{ secrets.ERAFALL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/erafall-release.jks"
          chosen="$ERAFALL_KEY_ALIAS"
          if ! keytool -list -keystore "$ks" -storepass "$ERAFALL_STORE_PASSWORD" -alias "$chosen" > /dev/null 2>&1; then
            mapfile -t private_keys < <(
              keytool -list -v -keystore "$ks" -storepass "$ERAFALL_STORE_PASSWORD" |
                awk '/Alias name: /{name=substr($0,index($0,":")+2)} /Entry type: PrivateKeyEntry/{print name}'
            )
            if [[ "${#private_keys[@]}" -ne 1 ]]; then
              echo "Alias secret did not match and the keystore does not have exactly one unambiguous private key." >&2
              exit 1
            fi
            chosen="${private_keys[0]}"
            echo "Configured alias differed; safely using the keystore's only private signing key."
          fi
          echo "ERAFALL_SIGNING_ALIAS=$chosen" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$chosen" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ERAFALL_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Signing key identity resolved without revealing the alias."

      - name: Export signed release APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release Android build/EraFall-release.apk 2>&1 | tee /tmp/export.log
          test -s build/EraFall-release.apk

      - name: Verify APK signature matches release keystore
        env:
          ERAFALL_STORE_PASSWORD: ${{ secrets.ERAFALL_STORE_PASSWORD }}
          ERAFALL_KEY_ALIAS: ${{ secrets.ERAFALL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs build/EraFall-release.apk | tee /tmp/signature.txt
          KEY_FP=$(keytool -list -v -keystore "$RUNNER_TEMP/erafall-release.jks" -storepass "$ERAFALL_STORE_PASSWORD" -alias "$ERAFALL_SIGNING_ALIAS" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_FP=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]')
          [[ -n "$KEY_FP" && "$KEY_FP" == "$APK_FP" ]] || { echo "APK signer does not match the release keystore" >&2; exit 1; }
          echo "APK signer matches the configured release keystore."

      - name: Publish signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EraFall-Android-0.2-signed
          path: build/EraFall-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Android emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/smoke-test.sh

      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/erafall-release.jks"
