name: Install EraFall source bundle

on:
  push:
    branches: [main]
    paths: ['bootstrap/erafall-project.tar.xz.b64']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand and commit Godot project
        run: |
          set -euo pipefail
          base64 -d bootstrap/erafall-project.tar.xz.b64 > /tmp/erafall-project.tar.xz
          tar -xJf /tmp/erafall-project.tar.xz -C .
          python3 tests/check_catalog.py
          rm bootstrap/erafall-project.tar.xz.b64
          rmdir bootstrap || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add EraFall Godot starter with seven playable eras"
            git push origin HEAD:main
          fi
